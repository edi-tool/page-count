<body>

    <div class="container">
        <a class="brand-link" href="https://edi-tool.github.io/">edi-tool</a>
        <h1>ページ調整さん</h1>
        <span class="subtitle">暫定のページ数から、台数の<strong>きりの良いページ数</strong>と、<strong>だいたいの背幅</strong>を表示します</span>

        <label class="instruction" for="pageInput">暫定のページ数を入力</label>
        <!-- type="number" は全角数字を受け付けないため text + inputmode にして normalizeNumber で半角化する -->
        <input type="text" id="pageInput" placeholder="例: 160" inputmode="numeric" autocomplete="off" oninput="calculate()">

        <label class="instruction" for="thicknessInput">紙の厚さ (mm)を選択</label>
        <select id="thicknessInput" onchange="calculate()">
            <option value="0.09">0.09 (薄め)</option>
            <option value="0.10">0.10 (薄め)</option>
            <option value="0.11" selected>0.11 (標準)</option>
            <option value="0.12">0.12 (標準)</option>
            <option value="0.13">0.13 (標準)</option>
            <option value="0.14">0.14 (厚め)</option>
            <option value="0.15">0.15 (厚め)</option>
        </select>

        <div id="results" class="result" aria-live="polite"></div>
    </div>

    <footer>
        <a href="https://edi-tool.github.io/">← edi-tool ツール一覧</a> | &copy; 2026 ISHIKAWA, Natsuki | MIT License
    </footer>

    <script>
        // 全角数字→半角に正規化
        function normalizeNumber(str) {
            return str.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
        }

        // 並製本の背幅: ページ数 ÷ 2 × 紙厚 + 0.8
        function spineWidth(pages, thickness) {
            return (pages / 2) * thickness + 0.8;
        }

        function calculate() {
            const raw = document.getElementById('pageInput').value.trim();
            const normalized = normalizeNumber(raw);
            const p = Number(normalized);
            const thickness = parseFloat(document.getElementById('thicknessInput').value);
            const resultsDiv = document.getElementById('results');

            if (!raw) {
                resultsDiv.innerHTML = '';
                return;
            }
            if (!/^\d+$/.test(normalized) || p <= 0) {
                resultsDiv.innerHTML = '<div class="option error">正の整数を入力してください</div>';
                return;
            }

            // ページ数調整の計算
            const units = [16, 8]; // 16ページ(全台)、8ページ(半台)
            let html = '<h2>おすすめのページ数</h2>';

            units.forEach(unit => {
                const low = Math.floor(p / unit) * unit;
                const high = Math.ceil(p / unit) * unit;

                html += `<div class="option">
                    <span class="option-title">${unit}ページ単位（${unit === 16 ? '全台' : '半台'}刻み）</span>`;

                if (low === p) {
                    html += `現在、ちょうど <span class="highlight">${p}ページ</span> (${p / unit}台) です！`;
                } else {
                    // 増減の少ないほうに「近い」を付ける（同数なら両方）
                    const lowDiff = p - low;
                    const highDiff = high - p;
                    const plans = [
                        { label: '案A', pages: low, diff: `${lowDiff}ページ減らす`, near: lowDiff <= highDiff },
                        { label: '案B', pages: high, diff: `${highDiff}ページ増やす`, near: highDiff <= lowDiff },
                    ].filter(plan => plan.pages > 0);
                    html += '<ul class="plan-list">';
                    plans.forEach(plan => {
                        html += `<li class="plan">${plan.label}: <span class="highlight">${plan.pages}ページ</span> (${plan.pages / unit}台)
                            ${plan.near ? '<span class="badge">近い</span>' : ''}
                            <span class="plan-diff">${plan.diff}</span>
                            <span class="plan-spine">背幅 約${spineWidth(plan.pages, thickness).toFixed(2)}mm</span></li>`;
                    });
                    html += '</ul>';
                }
                html += `</div>`;
            });

            html += `<h2>だいたいの背幅</h2>`;
            html += `<div class="option">
                <span class="option-title">並製本（入力した${p}ページの場合）</span>
                約 <span class="highlight highlight-lg">${spineWidth(p, thickness).toFixed(2)} mm</span><br>
                <small>計算式: ${p}p ÷ 2 × ${thickness.toFixed(2)}mm ＋ 0.8mm</small>
            </div>`;

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
